<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Diagram: 8 learned trainable vectors plus fixed problem tokens feed into a frozen 0.6B language model, which produces a predicted answer compared against training loss. Gradients update only the eight learned vectors, not the model's weights." font-family="ui-sans-serif,system-ui,sans-serif">

  <!-- Row 1: trainable vectors + problem tokens -->
  <rect x="20" y="20" width="290" height="72" rx="10" fill="#F97316" opacity="0.08"/>
  <rect x="20" y="20" width="290" height="72" rx="10" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.65"/>
  <text x="165" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#71717A">8 learned vectors</text>
  <text x="165" y="74" text-anchor="middle" font-size="13" fill="#F97316" opacity="0.9">Trainable</text>

  <text x="320" y="63" text-anchor="middle" font-size="22" fill="#71717A" opacity="0.7">+</text>

  <rect x="330" y="20" width="290" height="72" rx="10" fill="none" stroke="#71717A" stroke-width="1.5" opacity="0.35"/>
  <text x="475" y="52" text-anchor="middle" font-size="15" font-weight="600" fill="#71717A">Problem tokens</text>
  <text x="475" y="74" text-anchor="middle" font-size="13" fill="#71717A" opacity="0.75">Fixed input</text>

  <!-- Arrow 1 -->
  <text x="320" y="117" text-anchor="middle" font-size="20" fill="#71717A" opacity="0.6">&#8595;</text>

  <!-- Frozen model -->
  <rect x="20" y="130" width="600" height="60" rx="10" fill="none" stroke="#71717A" stroke-width="1.5" opacity="0.55"/>
  <text x="320" y="166" text-anchor="middle" font-size="15.5" font-weight="600" fill="#71717A">Frozen 0.6B language model</text>

  <!-- Arrow 2 -->
  <text x="320" y="213" text-anchor="middle" font-size="20" fill="#71717A" opacity="0.6">&#8595;</text>

  <!-- Predicted answer -->
  <rect x="20" y="222" width="600" height="60" rx="10" fill="none" stroke="#71717A" stroke-width="1.5" opacity="0.55"/>
  <text x="320" y="258" text-anchor="middle" font-size="15.5" font-weight="600" fill="#71717A">Predicted answer &#8594; training loss</text>

  <!-- Caption -->
  <text x="320" y="312" text-anchor="middle" font-size="12.5" fill="#71717A" opacity="0.75">Gradients update only the eight learned vectors, not the model's weights.</text>
</svg>
